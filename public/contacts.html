<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InCase</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="has-tabbar">
    <nav class="topnav">
        <a href="home.html" class="brand"><span class="dot"></span>InCase</a>
        <div class="links">
            <a href="home.html">Home</a>
            <a href="contacts.html" class="active">Contacts</a>
            <a href="profile.html">Profile</a>
            <a href="security.html">Security</a>
            <a href="admin.html">Admin</a>
        </div>
        <div class="user"><span class="avatar"></span> <span class="user-name"></span> <a href="login.html">Log out</a></div>
    </nav>

    <main class="container">
        <div class="page-head">
            <div>
                <p class="eyebrow" id="people-count"></p>
                <h1>Contacts</h1>
            </div>
        <button class="btn btn-dark" id="open-drawer"><img src="images/plus.png" alt="">Add Contact</button>
        </div>

        <form class="search" id="search-form" role="search">
            <img src="images/search.png" alt="">
            <input type="search" id="search" placeholder="Search name or phone" aria-label="Search name or phone" maxlength="100" autocomplete="off">
        </form>

        <div class="flash" id="page-message" hidden><span></span></div>

        <div class="filters" id="filters">
            <button class="filter active" data-filter="all">All</button>
            <button class="filter" data-filter="family">Family</button>
            <button class="filter" data-filter="friend">Friends</button>
            <button class="filter" data-filter="doctor">Medical</button>
            <button class="filter" data-filter="neighbour">Neighbours</button>
            <button class="filter" data-filter="work">Work</button>
            <button class="filter" data-filter="review">Needs review</button>
        </div>

        <div class="list" id="contact-list">
        </div>
        <p class="muted empty" id="no-results" hidden></p>
    </main>
    <aside class="drawer" id="drawer">
        <div class="drawer-head">
            <h2 id="drawer-title">Add contact</h2>
            <button class="icon-btn close-drawer"><img src="images/x.png" alt=""></button>
        </div>

        <form action="contacts.html" id="contact-form" novalidate>
            <div class="field">
                <label for="c-name">Name</label>
                <input type="text" id="c-name" name="name" placeholder="John Mike" maxlength="80" required>
                <div class="error" data-error-for="c-name" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>
            </div>

            <div class="field">
                <label for="c-phone">Phone</label>
                <input type="tel" id="c-phone" name="phone" placeholder="+234 8145237643" maxlength="20" required>
                <div class="error" data-error-for="c-phone" hidden><img src="images/triangle-alert.png" alt=""> <span>Error: needs 10 digits after +234. Add 4 more</span></div>
            </div>

            <div class="field">
                <label>Relationship</label>
                <div class="chip-group">
                    <label class="chip"><input type="radio" name="rel" value="family" checked><span>Family</span></label>
                    <label class="chip"><input type="radio" name="rel" value="friend"><span>Friend</span></label>
                    <label class="chip"><input type="radio" name="rel" value="doctor"><span>Doctor</span></label>
                    <label class="chip"><input type="radio" name="rel" value="neighbour"><span>Neighbour</span></label>
                    <label class="chip"><input type="radio" name="rel" value="work"><span>Work</span></label>
                </div>
            </div>

            <div class="field">
                <label for="c-label">Label (optional)</label>
                <input type="text" id="c-label" name="label" placeholder="e.g. Brother, Family doctor" maxlength="40">
                <div class="error" data-error-for="c-label" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>
            </div>

            <div class="field">
                <label for="c-note">Note</label>
                <textarea name="note" id="c-note" rows="3" maxlength="500" placeholder="Optional, e.g. Has a spare key (stored encrypted)"></textarea>
                <div class="error" data-error-for="c-note" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>
            </div>

            <label class="verify"><input type="checkbox" id="c-verified"> I've checked this number works</label>

            <div class="error-box error" id="drawer-error" hidden><span></span></div>

            <div class="drawer-actions">
                <button type="submit" class="btn btn-dark btn-wide">Save contact</button>
                <button type="button" class="btn close-drawer">Cancel</button>
            </div>
        </form>
    </aside>
    <nav class="tabbar">
        <a href="home.html"><i data-lucide="house"></i>Home</a>
        <a href="contacts.html" class="active"><i data-lucide="users"></i>Contacts</a>
        <a href="profile.html"><i data-lucide="user"></i>Profile</a>
        <a href="security.html"><i data-lucide="shield-check"></i>Security</a>
        <a href="admin.html"><i data-lucide="lock"></i>Admin</a>
    </nav>
    <script src="js/lucide.min.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="script.js"></script>
    <script src="js/contacts.js"></script>
</body>
</html>
