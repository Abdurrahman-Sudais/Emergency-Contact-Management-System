<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InCase</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="has-tabbar">
    <nav class="topnav">
        <a href="home.html" class="brand"><span class="dot"></span>InCase</a>
        <div class="links">
            <a href="home.html" class="active">Home</a>
            <a href="contacts.html">Contacts</a>
            <a href="profile.html">Profile</a>
            <a href="security.html">Security</a>
            <a href="admin.html">Admin</a>
        </div>

        <div class="user"><span class="avatar"></span> <span class="user-name"></span> <a href="login.html">Log out</a></div>
    </nav>

    <main class="container">
        <div class="desk-only page-head">
            <div>
                <p class="eyebrow today"></p>
                <h1>Who do you call first?</h1>
            </div>

            <a href="contacts.html" class="btn btn-dark"><img src="images/plus.png" alt="">Add a contact</a>
        </div>

        <div class="mobile-only">
            <div class="page-head">
                <div>
                    <p class="eyebrow today"></p>
                    <h1>Hi, <span id="first-name"></span></h1>
                </div>
                <a href="profile.html" class="avatar big" id="avatar-big"></a>
            </div>
        </div>

        <section class="card empty-card" id="no-contacts" hidden>
            <h2>No one on your list yet</h2>
            <p class="muted">Add the person you'd want called first. It takes less than a minute.</p>
            <a href="step4.html" class="btn btn-orange"><img src="images/plus.png" alt=""> Add your first contact</a>
        </section>

        <div class="dash-grid" id="dash-grid" hidden>
            <section class="card hero-card">
                <span class="badge green" id="hero-badge"><img src="images/check.png" alt=""> Verified</span>
                <p class="hero-num">01</p>
                <h2 class="hero-name" id="hero-name"></h2>
                <p class="muted mono" id="hero-meta"></p>
                <a href="#" class="btn btn-orange" id="hero-call"><img src="images/phone.png" alt=""> <span></span></a>
            </section>

            <div class="side-list" id="side-list">
            </div>
        </div>

        <div class="two-col">
            <section class="card">
                <h2>Readiness</h2>
                <p class="muted" id="ready-count"></p>
                <ul class="checklist" id="checklist">
                </ul>
            </section>
            <section class="card desk-only">
                <h2>Recent activity</h2>
                <ul class="activity" id="activity">
                </ul>
            </section>
        </div>

        <nav class="tabbar">
            <a href="home.html" class="active"><i data-lucide="house"></i>Home</a>
            <a href="contacts.html"><i data-lucide="users"></i>Contacts</a>
            <a href="profile.html"><i data-lucide="user"></i>Profile</a>
            <a href="security.html"><i data-lucide="shield-check"></i>Security</a>
        <a href="admin.html"><i data-lucide="lock"></i>Admin</a>
        </nav>
    <script src="js/lucide.min.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
