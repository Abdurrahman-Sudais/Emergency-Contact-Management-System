<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InCase</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="split">
    <aside class="side orange">
        <a href="index.html" class="brand"><span class="dot"></span>InCase</a>
        <div class="middle">
            <h2>Set up in two minutes.</h2>
            <ol class="steps">
                <li>1&nbsp; Create your account</li>
                <li>2&nbsp; A quick tour</li>
                <li>3&nbsp; Add your first contact</li>
            </ol>
        </div>
    </aside>
    <main class="form-side">
        <form class="form" action="step1.html" id="signup-form" novalidate>
            <h1>Create account</h1>
            <p class="muted">Already registered? <a href="login.html"><b>Log in</b></a></p>

            <div class="field">
                <label for="name">Full name</label>
                <input id="name" name="name" type="text" placeholder="Amina Bello" autocomplete="name" maxlength="80" required>
                <div class="error" data-error-for="name" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="amina@gmail.com" autocomplete="email" maxlength="254" required>
                <div class="error" data-error-for="email" hidden><img src="images/triangle-alert.png" alt=""><span>Error: add the part after @, like amina@gmail.com</span></div>
            </div>

            <div class="field">
                <label for="password">Password</label>
                <div class="row">
                    <input id="password" name="password" type="password" autocomplete="new-password" maxlength="128" required>
                    <button type="button" class="btn toggle-pw" id="toggle"><img src="images/eye.png" alt=""> Show</button>
                </div>
                <div class="check" data-check="length"><img src="images/x.png" alt=""> 10 or more characters</div>
                <div class="check" data-check="symbol"><img src="images/x.png" alt=""> One symbol, like ! or #</div>
                <div class="error" data-error-for="password" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>
            </div>

            <button type="submit" class="btn btn-dark btn-wide">Continue <img src="images/arrow-right.png" alt=""></button>
        </form>
    </main>

    <script src="show.js"></script>
    <script src="js/validate.js"></script>
    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
