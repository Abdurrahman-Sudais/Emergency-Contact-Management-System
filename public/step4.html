<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InCase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="screen light">
        <div class="topbar">
            <a href="step3.html" class="back"><img src="images/arrow-left.png" alt=""></a>
            <span class="step-label">LAST STEP</span>
        </div>

        <h2>Who should we call first?</h2>
        <p>One person is enough. You can add more later.</p>

        <form action="home.html" class="fields" id="first-contact" novalidate>
            <label class="lbl" for="name">Name</label>
            <input class="input" id="name" name="name" type="text" placeholder="Tunde Bello" maxlength="80" required>
            <div class="error" data-error-for="name" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>

            <label class="lbl" for="phone">Phone number</label>
            <div class="phone-row">
                <input class="input" id="country" type="tel" inputmode="tel" value="+234" maxlength="5" list="country-codes" aria-label="Country code" autocomplete="tel-country-code">
                <datalist id="country-codes">
                    <option value="+234">Nigeria</option>
                    <option value="+233">Ghana</option>
                    <option value="+229">Benin</option>
                    <option value="+228">Togo</option>
                    <option value="+227">Niger</option>
                    <option value="+237">Cameroon</option>
                    <option value="+225">Côte d'Ivoire</option>
                    <option value="+221">Senegal</option>
                    <option value="+27">South Africa</option>
                    <option value="+254">Kenya</option>
                    <option value="+255">Tanzania</option>
                    <option value="+256">Uganda</option>
                    <option value="+250">Rwanda</option>
                    <option value="+251">Ethiopia</option>
                    <option value="+20">Egypt</option>
                    <option value="+212">Morocco</option>
                    <option value="+44">United Kingdom</option>
                    <option value="+353">Ireland</option>
                    <option value="+1">USA / Canada</option>
                    <option value="+49">Germany</option>
                    <option value="+33">France</option>
                    <option value="+34">Spain</option>
                    <option value="+39">Italy</option>
                    <option value="+31">Netherlands</option>
                    <option value="+971">United Arab Emirates</option>
                    <option value="+966">Saudi Arabia</option>
                    <option value="+974">Qatar</option>
                    <option value="+90">Turkey</option>
                    <option value="+91">India</option>
                    <option value="+86">China</option>
                    <option value="+81">Japan</option>
                    <option value="+61">Australia</option>
                    <option value="+55">Brazil</option>
                </datalist>
                <input class="input" id="phone" name="phone" type="tel" placeholder="802 555 0142" maxlength="20" required>
            </div>
            <div class="error" data-error-for="phone" hidden><img src="images/triangle-alert.png" alt=""><span></span></div>

            <span class="lbl">Who are they to you?</span>
            <div class="chip-group">
                <label class="chip"><input type="radio" name="relation" value="family" checked><span>Family</span></label>
                <label class="chip"><input type="radio" name="relation" value="friend"><span>Friend</span></label>
                <label class="chip"><input type="radio" name="relation" value="doctor"><span>Doctor</span></label>
                <label class="chip"><input type="radio" name="relation" value="neighbour"><span>Neighbour</span></label>
            </div>

            <div class="error-box error" id="form-error" hidden><span></span></div>

            <div class="spacer">
                <button type="submit" class="next">Save and finish</button>
                <a href="home.html" class="later">I'll do this later</a>
            </div>
        </form>
    </div>
    <script src="js/validate.js"></script>
    <script src="js/api.js"></script>
    <script src="js/step4.js"></script>
</body>
</html>
